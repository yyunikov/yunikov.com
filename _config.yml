# Site settings
title: Yuriy Yunikov
head-title: Yuriy Yunikov - Engineering leader focused on building high-performing teams and scalable software.
description: 'Engineering leader focused on building high-performing teams and scalable software.'
url: 'https://www.yunikov.com'
baseurl: ''

google_analytics: G-FZ2RNCGZL3

author:
  name: 'Yuriy Yunikov'
  email: hello@yunikov.com
  stackoverflow_username: 1889928/yyunikov
  # facebook_username: joshgerdes
  github_username: yyunikov
  linkedin_username: yyunikov
  google_play_link: https://play.google.com/store/apps/dev?id=6972910091202284868
  
defaults:
  - scope:
      path: ''
      type: 'posts'
    values:
        layout: 'post'

# Build settings
destination: _site
paginate: 10
permalink: /:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge

sass:
    sass_dir: _sass
    style: compressed
    sourcemap: never

kramdown:
  # use Github Flavored Markdown
  input: GFM
  # do not replace newlines by <br>s
  hard_wrap: false

plugins:
  - jekyll-paginate
  - jekyll-sitemap

exclude: ['README.md', 'CLAUDE.md', 'LICENSE-jekyll-uno', 'Gemfile', 'Gemfile.lock', 'docker-compose.yml', 'vendor', '.ruby-version']
